# Deploy to staging on every push to main.
#
# Pipeline:
#   1. Build + push 4 container images to ECR.
#   2. terraform apply against envs/staging.
#   3. Run a one-off ECS migration task.
#   4. Force-redeploy the 4 ECS services and wait for stable.
#   5. Post-deploy smoke test against https://staging-api.jainpathshala.org.
#   6. Slack notification.

name: Deploy Staging

on:
  push:
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_BASE: ${{ secrets.AWS_ACCOUNT_ID_STAGING }}.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
          - service: worker
            dockerfile: apps/api/Dockerfile.worker
          - service: web
            dockerfile: apps/web/Dockerfile
          - service: ai
            dockerfile: infra/docker/ai.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_STAGING }}:role/gh-actions-staging
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push ${{ matrix.service }}
        run: |
          IMAGE="${{ env.ECR_BASE }}/jp-${{ matrix.service }}:staging-${{ github.sha }}"
          docker build -f ${{ matrix.dockerfile }} -t "$IMAGE" .
          docker push "$IMAGE"
          docker tag "$IMAGE" "${{ env.ECR_BASE }}/jp-${{ matrix.service }}:staging-latest"
          docker push "${{ env.ECR_BASE }}/jp-${{ matrix.service }}:staging-latest"

  terraform-apply:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_STAGING }}:role/gh-actions-staging
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
      - name: Apply
        working-directory: infra/terraform/envs/staging
        run: |
          terraform init \
            -backend-config="bucket=jp-tfstate-staging" \
            -backend-config="key=staging/terraform.tfstate" \
            -backend-config="region=ap-south-1" \
            -backend-config="dynamodb_table=jp-tfstate-lock"
          terraform apply -auto-approve \
            -var "image_tag=staging-${{ github.sha }}" \
            -var "ecr_account_id=${{ secrets.AWS_ACCOUNT_ID_STAGING }}"

  migrate:
    needs: terraform-apply
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_STAGING }}:role/gh-actions-staging
          aws-region: ${{ env.AWS_REGION }}
      - name: Run migration task
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster jp-staging-cluster \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.STAGING_PRIVATE_SUBNETS }}],securityGroups=[${{ secrets.STAGING_TASK_SG }}]}" \
            --task-definition jp-staging-migrate \
            --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster jp-staging-cluster --tasks "$TASK_ARN"
          EXIT=$(aws ecs describe-tasks --cluster jp-staging-cluster --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          test "$EXIT" = "0"

  deploy-services:
    needs: migrate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, worker, web, ai]
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_STAGING }}:role/gh-actions-staging
          aws-region: ${{ env.AWS_REGION }}
      - name: Force redeploy ${{ matrix.service }}
        run: |
          aws ecs update-service \
            --cluster jp-staging-cluster \
            --service jp-staging-${{ matrix.service }} \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster jp-staging-cluster \
            --services jp-staging-${{ matrix.service }}

  smoke-tests:
    needs: deploy-services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test
        run: bash infra/smoke-tests/prod-smoke.sh https://staging-api.jainpathshala.org

  notify:
    needs: [deploy-services, smoke-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Slack notification
        if: ${{ env.SLACK_WEBHOOK_DEPLOYS != '' }}
        run: |
          status="${{ needs.deploy-services.result }}"
          curl -fsS -X POST "${{ secrets.SLACK_WEBHOOK_DEPLOYS }}" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"Staging deploy ${status} — ${{ github.sha }}\"}"
        env:
          SLACK_WEBHOOK_DEPLOYS: ${{ secrets.SLACK_WEBHOOK_DEPLOYS }}
