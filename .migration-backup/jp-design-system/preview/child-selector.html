<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:flex; align-items:center; gap:10px;">
    <div style="display:inline-flex; align-items:center; gap:8px; padding:6px 8px 6px 6px; background:#FFFFFF; border:1.5px solid #D4621A; border-radius:999px; box-shadow:0 1px 2px rgba(122,24,24,.06);">
      <div style="width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#E8A06A,#D4621A);color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;">AR</div>
      <div style="font-weight:600; font-size:14px; color:#1A0A00;">Aarav</div>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#D4621A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:2px;"><path d="m6 9 6 6 6-6"/></svg>
    </div>
    <div style="display:inline-flex; align-items:center; gap:8px; padding:6px 14px 6px 6px; background:#FDF8F2; border:1px solid #E6D8C2; border-radius:999px;">
      <div style="width:28px;height:28px;border-radius:50%;background:#F5EDE0;color:#7A1818;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;">DM</div>
      <div style="font-weight:600; font-size:14px; color:#8B6F5E;">Diya</div>
    </div>
    <div style="display:inline-flex; align-items:center; gap:6px; padding:6px 14px; background:#FDF8F2; border:1px dashed #C4A882; border-radius:999px; color:#8B6F5E; font-size:13px; font-weight:600;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Add child
    </div>
  </div>
  <div style="margin-top:12px; font-size:12px; color:#8B6F5E;">Parent header — active child has saffron ring + chevron. Tap to switch; long-press to manage.</div>
</div>
</body></html>
