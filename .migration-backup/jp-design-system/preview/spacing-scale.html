<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:flex; align-items:flex-end; gap:10px;">
    <div style="text-align:center;"><div style="background:#D4621A; width:4px;  height:4px;  border-radius:1px;"></div><div class="mono" style="margin-top:6px;">1·4</div></div>
    <div style="text-align:center;"><div style="background:#D4621A; width:8px;  height:8px;  border-radius:2px;"></div><div class="mono" style="margin-top:6px;">2·8</div></div>
    <div style="text-align:center;"><div style="background:#D4621A; width:12px; height:12px; border-radius:2px;"></div><div class="mono" style="margin-top:6px;">3·12</div></div>
    <div style="text-align:center;"><div style="background:#D4621A; width:16px; height:16px; border-radius:3px;"></div><div class="mono" style="margin-top:6px;">4·16</div></div>
    <div style="text-align:center;"><div style="background:#D4621A; width:20px; height:20px; border-radius:3px;"></div><div class="mono" style="margin-top:6px;">5·20</div></div>
    <div style="text-align:center;"><div style="background:#D4621A; width:24px; height:24px; border-radius:4px;"></div><div class="mono" style="margin-top:6px;">6·24</div></div>
    <div style="text-align:center;"><div style="background:#D4621A; width:32px; height:32px; border-radius:4px;"></div><div class="mono" style="margin-top:6px;">7·32</div></div>
    <div style="text-align:center;"><div style="background:#D4621A; width:40px; height:40px; border-radius:6px;"></div><div class="mono" style="margin-top:6px;">8·40</div></div>
    <div style="text-align:center;"><div style="background:#D4621A; width:48px; height:48px; border-radius:6px;"></div><div class="mono" style="margin-top:6px;">9·48</div></div>
    <div style="text-align:center;"><div style="background:#D4621A; width:64px; height:64px; border-radius:8px;"></div><div class="mono" style="margin-top:6px;">10·64</div></div>
    <div style="text-align:center;"><div style="background:#D4621A; width:80px; height:80px; border-radius:8px;"></div><div class="mono" style="margin-top:6px;">11·80</div></div>
  </div>
  <div style="margin-top:14px; font-size:12px; color:#8B6F5E;">4 px base. <b>--sp-4 (16)</b> is the default gutter. Card padding: <b>--sp-4</b> mobile, <b>--sp-6</b> tablet.</div>
</div>
</body></html>
