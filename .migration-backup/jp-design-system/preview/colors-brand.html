<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="swatch-grid" style="grid-template-columns: repeat(4, 1fr);">
    <div class="swatch">
      <div class="chip" style="background:#D4621A;"></div>
      <div class="name">Saffron</div>
      <div class="hex">#D4621A · primary</div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#7A1818;"></div>
      <div class="name">Maroon</div>
      <div class="hex">#7A1818 · chrome</div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#FDF8F2; border:1px solid #E6D8C2;"></div>
      <div class="name">Cream</div>
      <div class="hex">#FDF8F2 · bg</div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#C8941F;"></div>
      <div class="name">Gold</div>
      <div class="hex">#C8941F · MSV / Tirthankar</div>
    </div>
  </div>
  <div class="divider" style="margin:18px 0 12px;"></div>
  <div class="swatch-grid" style="grid-template-columns: repeat(6, 1fr); gap:8px;">
    <div class="swatch"><div class="chip" style="background:#FCEFE3;"></div><div class="hex">saffron-50</div></div>
    <div class="swatch"><div class="chip" style="background:#E8A06A;"></div><div class="hex">saffron-300</div></div>
    <div class="swatch"><div class="chip" style="background:#B5521A;"></div><div class="hex">saffron-700</div></div>
    <div class="swatch"><div class="chip" style="background:#F4E6E6;"></div><div class="hex">maroon-50</div></div>
    <div class="swatch"><div class="chip" style="background:#B45C5C;"></div><div class="hex">maroon-300</div></div>
    <div class="swatch"><div class="chip" style="background:#5C1010;"></div><div class="hex">maroon-700</div></div>
  </div>
</div>
</body></html>
