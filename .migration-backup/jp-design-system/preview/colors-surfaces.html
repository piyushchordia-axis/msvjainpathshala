<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card" style="background:#FDF8F2;">
  <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:12px;">
    <div>
      <div style="background:#FDF8F2; border:1px dashed #C4A882; height:90px; border-radius:12px;"></div>
      <div style="font-size:12px; font-weight:600; margin-top:8px;">bg</div>
      <div class="hex">#FDF8F2 · page</div>
    </div>
    <div>
      <div style="background:#FFFFFF; border:1px solid #E6D8C2; height:90px; border-radius:12px; box-shadow:0 1px 2px rgba(122,24,24,.06);"></div>
      <div style="font-size:12px; font-weight:600; margin-top:8px;">surface</div>
      <div class="hex">#FFFFFF · card</div>
    </div>
    <div>
      <div style="background:#F5EDE0; border:1px solid #E6D8C2; height:90px; border-radius:12px;"></div>
      <div style="font-size:12px; font-weight:600; margin-top:8px;">surface-2</div>
      <div class="hex">#F5EDE0 · subtle</div>
    </div>
    <div>
      <div style="background:#FFFFFF; height:90px; border-radius:16px; box-shadow:0 8px 24px rgba(122,24,24,.10), 0 2px 6px rgba(122,24,24,.06);"></div>
      <div style="font-size:12px; font-weight:600; margin-top:8px;">surface-3</div>
      <div class="hex">elevated / modal</div>
    </div>
  </div>
</div>
</body></html>
