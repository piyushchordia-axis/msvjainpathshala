<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:flex; align-items:flex-end; gap:14px;">
    <!-- Each tier: ascending pillar visual -->
    <div style="flex:1; text-align:center;">
      <div style="background:#8B6F5E; height:60px; border-radius:12px 12px 4px 4px;"></div>
      <div style="font-family:'Tiro Devanagari Sanskrit', serif; color:#8B6F5E; font-size:14px; margin-top:8px;">Jigyasu</div>
      <div style="font-size:10px; color:#8B6F5E; margin-top:2px;">0–99</div>
    </div>
    <div style="flex:1; text-align:center;">
      <div style="background:#166534; height:90px; border-radius:12px 12px 4px 4px;"></div>
      <div style="font-family:'Tiro Devanagari Sanskrit', serif; color:#166534; font-size:14px; margin-top:8px;">Shravak</div>
      <div style="font-size:10px; color:#8B6F5E; margin-top:2px;">100–299</div>
    </div>
    <div style="flex:1; text-align:center;">
      <div style="background:#1E3A8A; height:120px; border-radius:12px 12px 4px 4px;"></div>
      <div style="font-family:'Tiro Devanagari Sanskrit', serif; color:#1E3A8A; font-size:14px; margin-top:8px;">Sadhak</div>
      <div style="font-size:10px; color:#8B6F5E; margin-top:2px;">300–699</div>
    </div>
    <div style="flex:1; text-align:center;">
      <div style="background:#7A1818; height:150px; border-radius:12px 12px 4px 4px;"></div>
      <div style="font-family:'Tiro Devanagari Sanskrit', serif; color:#7A1818; font-size:14px; margin-top:8px;">Shraman</div>
      <div style="font-size:10px; color:#8B6F5E; margin-top:2px;">700–1499</div>
    </div>
    <div style="flex:1; text-align:center;">
      <div style="background:linear-gradient(180deg,#E6C26B,#C8941F); height:180px; border-radius:12px 12px 4px 4px; box-shadow:0 2px 8px rgba(200,148,31,0.4);"></div>
      <div style="font-family:'Tiro Devanagari Sanskrit', serif; color:#C8941F; font-size:14px; margin-top:8px; font-weight:600;">Tirthankar</div>
      <div style="font-size:10px; color:#8B6F5E; margin-top:2px;">1500+</div>
    </div>
  </div>
</div>
</body></html>
