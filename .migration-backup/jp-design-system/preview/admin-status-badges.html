<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:flex; flex-wrap:wrap; gap:10px;">
    <div style="display:inline-flex; align-items:center; gap:6px; padding:4px 10px; background:#FBEED0; color:#B45309; border-radius:999px; font-size:12px; font-weight:600;">
      <span style="width:6px;height:6px;border-radius:50%;background:#B45309;"></span> Pending
    </div>
    <div style="display:inline-flex; align-items:center; gap:6px; padding:4px 10px; background:#DCEEDD; color:#166534; border-radius:999px; font-size:12px; font-weight:600;">
      <span style="width:6px;height:6px;border-radius:50%;background:#166534;"></span> Approved
    </div>
    <div style="display:inline-flex; align-items:center; gap:6px; padding:4px 10px; background:#FBE5E5; color:#B91C1C; border-radius:999px; font-size:12px; font-weight:600;">
      <span style="width:6px;height:6px;border-radius:50%;background:#B91C1C;"></span> Rejected
    </div>
    <div style="display:inline-flex; align-items:center; gap:6px; padding:4px 10px; background:#DDE3F4; color:#1E3A8A; border-radius:999px; font-size:12px; font-weight:600;">
      <span style="width:6px;height:6px;border-radius:50%;background:#1E3A8A;"></span> In review
    </div>
    <div style="display:inline-flex; align-items:center; gap:6px; padding:4px 10px; background:#F5EDE0; color:#8B6F5E; border-radius:999px; font-size:12px; font-weight:600;">
      <span style="width:6px;height:6px;border-radius:50%;background:#8B6F5E;"></span> Resolved
    </div>
    <div style="display:inline-flex; align-items:center; gap:6px; padding:4px 10px; background:#FCEFE3; color:#D4621A; border-radius:999px; font-size:12px; font-weight:600;">
      <span style="width:6px;height:6px;border-radius:50%;background:#D4621A;"></span> Active
    </div>
    <div style="display:inline-flex; align-items:center; gap:6px; padding:4px 10px; background:#F5EDE0; color:#C4A882; border-radius:999px; font-size:12px; font-weight:600;">
      <span style="width:6px;height:6px;border-radius:50%;background:#C4A882;"></span> Inactive
    </div>
  </div>
  <div style="margin-top:14px; font-size:12px; color:#8B6F5E;">Always paired with a dot. Capitalisation: Sentence case. Width auto-fits content; never set a fixed pixel width.</div>
</div>
</body></html>
