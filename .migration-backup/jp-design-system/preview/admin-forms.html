<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:grid; grid-template-columns: 1fr 1fr; gap:14px;">
    <div>
      <label style="font-size:12px; font-weight:600; color:#8B6F5E; display:block; margin-bottom:6px;">Student name</label>
      <div style="padding:10px 12px; background:#FFFFFF; border:1.5px solid #E6D8C2; border-radius:10px; font-size:14px; color:#1A0A00;">Aarav Mehta</div>
    </div>
    <div>
      <label style="font-size:12px; font-weight:600; color:#8B6F5E; display:block; margin-bottom:6px;">Father's name <span style="color:#C4A882;">· focused</span></label>
      <div style="padding:10px 12px; background:#FFFFFF; border:2px solid #D4621A; border-radius:10px; font-size:14px; color:#1A0A00; box-shadow:0 0 0 3px rgba(212,98,26,.28);">Rajesh Mehta</div>
    </div>
    <div>
      <label style="font-size:12px; font-weight:600; color:#8B6F5E; display:block; margin-bottom:6px;">Centre</label>
      <div style="padding:10px 12px; background:#FFFFFF; border:1.5px solid #E6D8C2; border-radius:10px; font-size:14px; color:#1A0A00; display:flex; justify-content:space-between; align-items:center;">
        Mahavir Centre
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8B6F5E" stroke-width="2.2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
      </div>
    </div>
    <div>
      <label style="font-size:12px; font-weight:600; color:#8B6F5E; display:block; margin-bottom:6px;">Date of birth</label>
      <div style="padding:10px 12px; background:#FFFFFF; border:1.5px solid #E6D8C2; border-radius:10px; font-size:14px; color:#1A0A00; display:flex; justify-content:space-between; align-items:center;">
        12 Aug 2011
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8B6F5E" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>
      </div>
    </div>
    <div style="grid-column:1/3;">
      <label style="font-size:12px; font-weight:600; color:#8B6F5E; display:block; margin-bottom:6px;">Photo · drop zone</label>
      <div style="padding:18px; background:#FDF8F2; border:1.5px dashed #C4A882; border-radius:10px; text-align:center; color:#8B6F5E; font-size:13px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle; margin-right:6px;"><path d="M12 16V4M5 11l7-7 7 7"/><path d="M20 20H4"/></svg>
        Drag a JPG/PNG here, or <span style="color:#D4621A; font-weight:600;">browse</span>
      </div>
    </div>
    <div>
      <label style="font-size:12px; font-weight:600; color:#B91C1C; display:block; margin-bottom:6px;">Phone · error</label>
      <div style="padding:10px 12px; background:#FBE5E5; border:1.5px solid #B91C1C; border-radius:10px; font-size:14px; color:#1A0A00;">+91 9876</div>
      <div style="font-size:11px; color:#B91C1C; margin-top:4px;">Phone must be 10 digits.</div>
    </div>
    <div>
      <label style="font-size:12px; font-weight:600; color:#C4A882; display:block; margin-bottom:6px;">Aadhaar · disabled</label>
      <div style="padding:10px 12px; background:#EFE6D5; border:1.5px solid #E6D8C2; border-radius:10px; font-size:14px; color:#C4A882;">XXXX-XXXX-1234</div>
    </div>
  </div>
</div>
</body></html>
