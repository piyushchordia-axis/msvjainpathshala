<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="background:#1A0F08; color:#FDF8F2;">
<div class="card" style="background:#1A0F08;">
  <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:12px;">
    <div>
      <div style="background:#1A0F08; border:1px dashed #4A3727; height:80px; border-radius:12px;"></div>
      <div style="font-size:12px; font-weight:600; color:#FDF8F2; margin-top:8px;">bg</div>
      <div style="font-family:'JetBrains Mono'; font-size:10px; color:#C4A882;">#1A0F08</div>
    </div>
    <div>
      <div style="background:#261A11; border:1px solid #4A3727; height:80px; border-radius:12px;"></div>
      <div style="font-size:12px; font-weight:600; color:#FDF8F2; margin-top:8px;">card</div>
      <div style="font-family:'JetBrains Mono'; font-size:10px; color:#C4A882;">#261A11</div>
    </div>
    <div>
      <div style="background:#2F2117; border:1px solid #4A3727; height:80px; border-radius:12px;"></div>
      <div style="font-size:12px; font-weight:600; color:#FDF8F2; margin-top:8px;">card-2</div>
      <div style="font-family:'JetBrains Mono'; font-size:10px; color:#C4A882;">#2F2117</div>
    </div>
    <div>
      <div style="background:#3A2A1E; height:80px; border-radius:16px; box-shadow:0 8px 24px rgba(0,0,0,0.55);"></div>
      <div style="font-size:12px; font-weight:600; color:#FDF8F2; margin-top:8px;">card-3</div>
      <div style="font-family:'JetBrains Mono'; font-size:10px; color:#C4A882;">#3A2A1E</div>
    </div>
  </div>
  <div style="margin-top:14px; padding:14px; background:#261A11; border:1px solid #4A3727; border-radius:12px;">
    <div style="font-family:'Tiro Devanagari Sanskrit',serif; color:#E8A06A; font-size:20px;">Today's Punya</div>
    <div style="color:#FDF8F2; font-size:13px; margin-top:4px;">Saffron + cream invert to warm dark — never pure gray.</div>
  </div>
</div>
</body></html>
