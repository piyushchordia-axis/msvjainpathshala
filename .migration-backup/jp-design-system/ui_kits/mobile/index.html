<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jain Pathshala — Mobile UI Kit</title>
<link rel="stylesheet" href="../../tokens.css">
<style>
  html, body { margin:0; padding:0; background:#F5EDE0; min-height:100vh; font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
  @keyframes jpSpin { to { transform: rotate(360deg); } }
  @keyframes jpBlink { 50% { opacity: 0; } }
  @keyframes jpPulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.4; transform:scale(1.15); } }
  .stage {
    min-height: 100vh; display:flex; flex-direction:column; align-items:center;
    padding: 32px 16px 48px;
    background:
      radial-gradient(circle at 20% 0%, #FDF8F2 0%, transparent 35%),
      radial-gradient(circle at 100% 100%, #FCEFE3 0%, transparent 40%),
      #F5EDE0;
  }
  .kit-header { width: min(960px, 100%); margin-bottom:24px; }
  .kit-header h1 { font-family: var(--font-display); color: var(--jp-maroon); font-size: 32px; line-height:1.1; margin:0; }
  .kit-header p { color: var(--jp-text-sub); margin:6px 0 0; font-size: 14px; max-width: 56ch; }
  .row { display:flex; gap:24px; align-items:flex-start; }
  .nav-panel {
    width: 240px; background: #FFFFFF; border: 1px solid var(--jp-border); border-radius: 16px;
    padding: 14px; box-shadow: var(--sh-2); position:sticky; top: 24px;
  }
  .nav-panel h2 { margin: 4px 6px 8px; font-family: var(--font-body); font-size: 13px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color: var(--jp-text-sub); }
  .nav-panel button {
    appearance:none; background:transparent; border:0; width:100%; text-align:left; padding:10px 12px;
    border-radius: 10px; font-family: var(--font-body); font-size:14px; font-weight:500;
    cursor:pointer; color: var(--jp-text-primary); display:flex; align-items:center; justify-content:space-between;
  }
  .nav-panel button.on { background: var(--jp-saffron-50); color: var(--jp-saffron); font-weight:600; }
  .nav-panel button .k { font-family: var(--font-mono); font-size: 10px; color: var(--jp-text-dim); }
  .footer { font-size: 12px; color: var(--jp-text-sub); margin-top: 18px; }
</style>
</head>
<body>
<div class="stage">
  <div class="kit-header">
    <h1>Mobile UI Kit</h1>
    <p>Clickable Expo prototype — parent's view of <b>Jain Pathshala</b>. Login &rarr; OTP &rarr; Home flows through attendance, Punya, notices, and profile. Use the side panel or the bottom tab bar inside the phone.</p>
  </div>
  <div class="row">
    <div class="nav-panel">
      <h2>Jump to screen</h2>
      <button data-go="login"   class="on">Login                <span class="k">↩</span></button>
      <button data-go="otp">OTP entry            <span class="k">⓹</span></button>
      <button data-go="home">Home — parent        <span class="k">⌂</span></button>
      <button data-go="attend">Attendance / GPS    <span class="k">✓</span></button>
      <button data-go="punya">Punya leaderboard   <span class="k">❉</span></button>
      <button data-go="notices">Notices             <span class="k">⚐</span></button>
      <button data-go="notice">Notice detail       <span class="k">⚐</span></button>
      <button data-go="profile">Profile             <span class="k">☺</span></button>
      <div class="footer">
        State is in-memory only. Reload to reset.<br>
        Source: <span style="font-family: var(--font-mono); color: var(--jp-saffron);">ui_kits/mobile/</span>
      </div>
    </div>
    <div id="root"></div>
  </div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tokens.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="app.jsx"></script>

<script>
// External nav panel — dispatch screen change to React via a global setter
window.__setScreen = null;
document.addEventListener('click', e => {
  const btn = e.target.closest('button[data-go]');
  if (!btn) return;
  document.querySelectorAll('.nav-panel button').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  if (window.__setScreen) window.__setScreen(btn.dataset.go);
});
</script>
</body>
</html>
