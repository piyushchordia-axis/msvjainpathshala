<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jain Pathshala — Design System</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Sanskrit:ital@0;1&family=Mukta:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --jp-saffron:#D4621A; --jp-saffron-700:#B5521A; --jp-saffron-300:#E8A06A; --jp-saffron-50:#FCEFE3;
    --jp-maroon:#7A1818; --jp-maroon-700:#5C1010; --jp-maroon-300:#B45C5C; --jp-maroon-50:#F4E6E6;
    --jp-cream:#FDF8F2; --jp-cream-dark:#F5EDE0; --jp-cream-deeper:#ECE0CC;
    --jp-text-primary:#1A0A00; --jp-text-sub:#8B6F5E; --jp-text-dim:#C4A882;
    --jp-gold:#C8941F; --jp-gold-300:#E6C26B; --jp-gold-50:#FAF1DC;
    --jp-age-bal:#B91C1C; --jp-age-kishor:#854D0E; --jp-age-tarun:#166534; --jp-age-yuva:#1E3A8A;
    --jp-age-bal-bg:#FBE5E5; --jp-age-kishor-bg:#F6ECD6; --jp-age-tarun-bg:#DCEEDD; --jp-age-yuva-bg:#DDE3F4;
    --jp-success:#166534; --jp-success-bg:#DCEEDD;
    --jp-warning:#B45309; --jp-warning-bg:#FBEED0;
    --jp-error:#B91C1C; --jp-error-bg:#FBE5E5;
    --jp-info:#1E3A8A; --jp-info-bg:#DDE3F4;
    --jp-bg:#FDF8F2; --jp-surface:#FFFFFF; --jp-surface-2:#F5EDE0; --jp-overlay:rgba(26,10,0,0.55);
    --jp-divider:#ECE0CC; --jp-border:#E6D8C2;
    --sh-1:0 1px 2px rgba(122,24,24,.06);
    --sh-2:0 2px 6px rgba(122,24,24,.08), 0 1px 2px rgba(122,24,24,.06);
    --sh-3:0 8px 24px rgba(122,24,24,.10), 0 2px 6px rgba(122,24,24,.06);
    --sh-4:0 20px 48px rgba(122,24,24,.16), 0 4px 12px rgba(122,24,24,.08);
    --font-display:"Tiro Devanagari Sanskrit", Georgia, serif;
    --font-body:"Mukta", -apple-system, system-ui, sans-serif;
    --font-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  [data-theme="dark"] {
    --jp-bg:#1A0F08; --jp-surface:#261A11; --jp-surface-2:#2F2117;
    --jp-divider:#3D2C20; --jp-border:#4A3727;
    --jp-text-primary:#FDF8F2; --jp-text-sub:#C4A882; --jp-text-dim:#8B6F5E;
    --jp-cream:#1A0F08; --jp-cream-dark:#261A11; --jp-cream-deeper:#3D2C20;
    --jp-saffron-50:#3A1E0A; --jp-maroon-50:#3A1414; --jp-gold-50:#3A2A0A;
    --jp-age-bal-bg:#3A1414; --jp-age-kishor-bg:#3A2A0F; --jp-age-tarun-bg:#0F2A18; --jp-age-yuva-bg:#15203F;
    --jp-success-bg:#0F2A18; --jp-warning-bg:#3A2A0F; --jp-error-bg:#3A1414; --jp-info-bg:#15203F;
    --sh-1:0 1px 2px rgba(0,0,0,0.5); --sh-2:0 2px 6px rgba(0,0,0,0.5); --sh-3:0 8px 24px rgba(0,0,0,0.55);
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body {
    background: var(--jp-bg); color: var(--jp-text-primary);
    font-family: var(--font-body); -webkit-font-smoothing: antialiased;
    transition: background 240ms cubic-bezier(.2,.8,.2,1), color 240ms;
  }
  @keyframes jpSpin { to { transform: rotate(360deg); } }
  @keyframes jpBlink { 50% { opacity:0; } }
  @keyframes jpPulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.4; transform:scale(1.15); } }
  ::selection { background: var(--jp-saffron-50); color: var(--jp-saffron-700); }
  html { scroll-behavior: smooth; }
  /* Hide scrollbars in nav rail */
  .rail::-webkit-scrollbar { width: 0; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useRef } = React;

/* ─────────── Tokens (live mirror of CSS vars) ─────────── */
const TOKENS = {
  brand: [
    { k:'saffron',      v:'#D4621A', note:'Primary action' },
    { k:'saffron-700',  v:'#B5521A', note:'Pressed' },
    { k:'saffron-300',  v:'#E8A06A', note:'Hover wash' },
    { k:'saffron-50',   v:'#FCEFE3', note:'Tint' },
    { k:'maroon',       v:'#7A1818', note:'Display + chrome' },
    { k:'maroon-700',   v:'#5C1010', note:'Pressed' },
    { k:'maroon-50',    v:'#F4E6E6', note:'Tint' },
    { k:'cream',        v:'#FDF8F2', note:'Page bg' },
    { k:'cream-dark',   v:'#F5EDE0', note:'Subtle surface' },
    { k:'cream-deeper', v:'#ECE0CC', note:'Divider' },
    { k:'gold',         v:'#C8941F', note:'MSV / Tirthankar' },
    { k:'gold-300',     v:'#E6C26B' },
    { k:'gold-50',      v:'#FAF1DC' },
  ],
  text: [
    { k:'text-primary', v:'#1A0A00' },
    { k:'text-sub',     v:'#8B6F5E' },
    { k:'text-dim',     v:'#C4A882' },
  ],
  age: [
    { k:'bal',    v:'#B91C1C', label:'Bal · 6–9' },
    { k:'kishor', v:'#854D0E', label:'Kishor · 10–13' },
    { k:'tarun',  v:'#166534', label:'Tarun · 14–17' },
    { k:'yuva',   v:'#1E3A8A', label:'Yuva · 18+' },
  ],
  tier: [
    { k:'jigyasu',    v:'#8B6F5E', range:'0–99',     sub:'Learner' },
    { k:'shravak',    v:'#166534', range:'100–299',  sub:'Listener' },
    { k:'sadhak',     v:'#1E3A8A', range:'300–699',  sub:'Seeker' },
    { k:'shraman',    v:'#7A1818', range:'700–1499', sub:'Ascetic' },
    { k:'tirthankar', v:'#C8941F', range:'1500+',    sub:'Enlightened' },
  ],
  semantic: [
    { k:'success', v:'#166534', bg:'#DCEEDD' },
    { k:'warning', v:'#B45309', bg:'#FBEED0' },
    { k:'error',   v:'#B91C1C', bg:'#FBE5E5' },
    { k:'info',    v:'#1E3A8A', bg:'#DDE3F4' },
  ],
  spacing: [
    { k:'sp-1', v:4 }, { k:'sp-2', v:8 }, { k:'sp-3', v:12 }, { k:'sp-4', v:16 },
    { k:'sp-5', v:20 }, { k:'sp-6', v:24 }, { k:'sp-7', v:32 }, { k:'sp-8', v:40 },
    { k:'sp-9', v:48 }, { k:'sp-10', v:64 }, { k:'sp-11', v:80 },
  ],
  radius: [
    { k:'r-xs', v:4 }, { k:'r-sm', v:8 }, { k:'r-md', v:12, star:true },
    { k:'r-lg', v:16 }, { k:'r-xl', v:24 }, { k:'r-pill', v:'999' },
  ],
  shadow: [
    { k:'sh-1', label:'hairline rest' },
    { k:'sh-2', label:'card hover' },
    { k:'sh-3', label:'elevated' },
    { k:'sh-4', label:'modal / sheet' },
  ],
  type: [
    { k:'h1',      size:32, lh:40, weight:600, family:'display', sample:"Today's Punya" },
    { k:'h2',      size:26, lh:34, weight:600, family:'display', sample:'Mahavir Centre' },
    { k:'h3',      size:20, lh:28, weight:600, family:'body',    sample:"This week's homework" },
    { k:'h4',      size:17, lh:24, weight:600, family:'body',    sample:'Punya leaderboard' },
    { k:'body-lg', size:17, lh:26, weight:400, family:'body',    sample:'Aarav has marked Present.' },
    { k:'body',    size:15, lh:22, weight:400, family:'body',    sample:'Aarav has marked Present.' },
    { k:'label',   size:14, lh:20, weight:500, family:'body',    sample:"Father's name" },
    { k:'caption', size:12, lh:16, weight:500, family:'body',    sample:'Updated 5 minutes ago' },
    { k:'overline',size:11, lh:14, weight:600, family:'body',    sample:'SPIRITUAL TIER', track:'.12em' },
  ],
};

/* ─────────── Icons ─────────── */
const Icon = ({ name, size=18, color='currentColor', fill='none' }) => {
  const P = { strokeWidth:1.85, strokeLinecap:'round', strokeLinejoin:'round',
    stroke: fill==='none' ? color : 'none', fill: fill==='none' ? 'none' : color };
  const paths = {
    home:<path d="M3 11 12 3l9 8v10a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1V11Z"/>,
    check:<path d="M9 11l3 3 4-4M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2Z"/>,
    bell:<g><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></g>,
    user:<g><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></g>,
    lotus:<path d="M12 2 9 9H2l5.5 4-2 7L12 16l6.5 4-2-7L22 9h-7Z"/>,
    chevron:<path d="m6 9 6 6 6-6"/>,
    chevronR:<path d="m9 6 6 6-6 6"/>,
    plus:<path d="M12 5v14M5 12h14"/>,
    close:<path d="M18 6 6 18M6 6l12 12"/>,
    checkOnly:<path d="M20 6 9 17l-5-5"/>,
    pin:<path d="m12 17 5-5h-3V3h-4v9H7l5 5Zm-7 4h14v-2H5v2Z"/>,
    clock:<g><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></g>,
    map:<g><circle cx="12" cy="10" r="3"/><path d="M12 2a8 8 0 0 0-8 8c0 7 8 12 8 12s8-5 8-12a8 8 0 0 0-8-8Z"/></g>,
    sun:<g><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></g>,
    moon:<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>,
    copy:<g><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></g>,
    sparkles:<g><path d="M12 4v3M12 17v3M4 12h3M17 12h3"/><path d="m6 6 2 2M16 16l2 2M16 8l2-2M6 18l2-2"/></g>,
    layers:<g><path d="m2 7 10 5 10-5L12 2Z"/><path d="m2 12 10 5 10-5M2 17l10 5 10-5"/></g>,
    type:<g><path d="M4 7V5h16v2M9 21h6M12 5v16"/></g>,
    palette:<g><circle cx="12" cy="12" r="10"/><circle cx="7" cy="10" r="1.4" fill={color}/><circle cx="12" cy="7" r="1.4" fill={color}/><circle cx="17" cy="10" r="1.4" fill={color}/><circle cx="16" cy="15" r="1.4" fill={color}/></g>,
    grid:<g><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></g>,
    box:<g><path d="M12 3 2 8v8l10 5 10-5V8Z"/><path d="M2 8l10 5 10-5M12 13v8"/></g>,
    badge:<g><circle cx="12" cy="8" r="6"/><path d="M8 13v8l4-3 4 3v-8"/></g>,
    image:<g><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></g>,
  };
  return <svg width={size} height={size} viewBox="0 0 24 24" {...P}>{paths[name]}</svg>;
};

/* ─────────── Mandala motif (faint decoration) ─────────── */
const Mandala = ({ size=240, color='var(--jp-saffron)', opacity=0.06 }) => (
  <svg width={size} height={size} viewBox="0 0 240 240" fill="none" stroke={color} strokeWidth="1.1" style={{ opacity }}>
    <circle cx="120" cy="120" r="8"/><circle cx="120" cy="120" r="28"/>
    <circle cx="120" cy="120" r="56"/><circle cx="120" cy="120" r="88"/><circle cx="120" cy="120" r="116"/>
    <g>
      <path id="petal" d="M120 32 C 112 64 112 96 120 120 C 128 96 128 64 120 32 Z"/>
      <use href="#petal" transform="rotate(45 120 120)"/><use href="#petal" transform="rotate(90 120 120)"/>
      <use href="#petal" transform="rotate(135 120 120)"/><use href="#petal" transform="rotate(180 120 120)"/>
      <use href="#petal" transform="rotate(225 120 120)"/><use href="#petal" transform="rotate(270 120 120)"/>
      <use href="#petal" transform="rotate(315 120 120)"/>
    </g>
  </svg>
);

/* ─────────── Small atomic components ─────────── */
const Card = ({ children, elevated, style, ...rest }) => (
  <div {...rest} style={{
    background:'var(--jp-surface)',
    border: elevated ? 'none' : '1px solid var(--jp-border)',
    borderRadius: elevated ? 16 : 12, padding:16,
    boxShadow: elevated ? 'var(--sh-3)' : 'var(--sh-1)',
    ...style,
  }}>{children}</div>
);

const Avatar = ({ initials='A', size=40, msv=false, gradient=true }) => (
  <div style={{ position:'relative', width:size, height:size, flexShrink:0 }}>
    <div style={{
      width:size, height:size, borderRadius:'50%',
      background: gradient ? 'linear-gradient(135deg, var(--jp-saffron-300), var(--jp-saffron))' : 'var(--jp-cream-dark)',
      color: gradient ? '#FFFFFF' : 'var(--jp-maroon)',
      display:'flex', alignItems:'center', justifyContent:'center',
      fontFamily:'var(--font-body)', fontWeight:700, fontSize:size*0.38,
      border: msv ? '3px solid var(--jp-gold-50)' : 'none', boxSizing:'border-box',
    }}>{initials}</div>
    {msv && (
      <div style={{
        position:'absolute', right:-2, bottom:-2, padding:'2px 5px', borderRadius:6,
        background:'linear-gradient(135deg, var(--jp-gold-300), var(--jp-gold))',
        color:'#FFFFFF', fontSize: Math.max(8, size*0.16), fontWeight:800,
        letterSpacing:'.04em', boxShadow:'0 1px 3px rgba(122,24,24,.18)',
      }}>MSV</div>
    )}
  </div>
);

const PrimaryButton = ({ children, leftIcon, loading, disabled, onClick, style }) => {
  const [p,setP] = useState(false);
  return (
    <button onClick={!disabled && !loading ? onClick : undefined}
      onPointerDown={()=>setP(true)} onPointerUp={()=>setP(false)} onPointerLeave={()=>setP(false)}
      disabled={disabled} style={{
        appearance:'none', border:0, cursor: disabled?'default':'pointer',
        height:46, padding:'0 18px', borderRadius:12, fontFamily:'var(--font-body)',
        fontSize:14, fontWeight:600,
        background: disabled?'var(--jp-cream-deeper)' : (p ? 'var(--jp-saffron-700)' : 'var(--jp-saffron)'),
        color: disabled ? 'var(--jp-text-dim)' : '#FFFFFF',
        boxShadow: disabled?'none':'var(--sh-2)',
        display:'inline-flex', alignItems:'center', justifyContent:'center', gap:8,
        transform: p ? 'scale(0.98)' : 'scale(1)',
        transition: 'transform 140ms cubic-bezier(.2,.8,.2,1), background 140ms',
        ...style,
      }}>
      {loading ? <span style={{ width:14, height:14, border:'2px solid rgba(255,255,255,.4)', borderTopColor:'#FFF', borderRadius:'50%', animation:'jpSpin 1s linear infinite' }}/> : leftIcon}
      {children}
    </button>
  );
};
const SecondaryButton = ({ children, onClick, style }) => {
  const [p,setP] = useState(false);
  return <button onClick={onClick}
    onPointerDown={()=>setP(true)} onPointerUp={()=>setP(false)} onPointerLeave={()=>setP(false)}
    style={{
      appearance:'none', cursor:'pointer', height:44, padding:'0 18px', borderRadius:12,
      fontFamily:'var(--font-body)', fontSize:14, fontWeight:600,
      background: p ? 'var(--jp-maroon-50)' : 'transparent',
      color: p ? 'var(--jp-maroon-700)' : 'var(--jp-maroon)',
      border: `1.5px solid ${p ? 'var(--jp-maroon-700)' : 'var(--jp-maroon)'}`,
      display:'inline-flex', alignItems:'center', justifyContent:'center', gap:8,
      transition: 'all 140ms cubic-bezier(.2,.8,.2,1)', ...style,
    }}>{children}</button>;
};
const GhostButton = ({ children, onClick, style }) => (
  <button onClick={onClick} style={{
    appearance:'none', border:0, background:'transparent', color:'var(--jp-saffron)',
    cursor:'pointer', height:40, padding:'0 14px', borderRadius:12,
    fontFamily:'var(--font-body)', fontSize:14, fontWeight:600, ...style,
  }}>{children}</button>
);

const AgePill = ({ group }) => {
  const colors = {
    Bal:    ['var(--jp-age-bal)',    'var(--jp-age-bal-bg)'],
    Kishor: ['var(--jp-age-kishor)', 'var(--jp-age-kishor-bg)'],
    Tarun:  ['var(--jp-age-tarun)',  'var(--jp-age-tarun-bg)'],
    Yuva:   ['var(--jp-age-yuva)',   'var(--jp-age-yuva-bg)'],
  }[group];
  return <span style={{
    display:'inline-flex', alignItems:'center', gap:5, padding:'3px 9px', borderRadius:999,
    background:colors[1], color:colors[0], fontSize:11, fontWeight:600,
  }}><span style={{ width:5, height:5, borderRadius:'50%', background:colors[0] }}/>{group}</span>;
};

const TierBadge = ({ tier }) => {
  const c = TOKENS.tier.find(t => t.k === tier.toLowerCase()).v;
  const gold = tier === 'Tirthankar';
  return <span style={{
    display:'inline-flex', alignItems:'center', gap:6, padding:'4px 10px', borderRadius:999,
    background: gold ? 'linear-gradient(180deg,#FAF1DC,#E6C26B)' : `${c}1f`,
    color: c, fontFamily:'var(--font-display)', fontSize:13,
    border: gold ? '1px solid var(--jp-gold)' : 'none',
  }}><span style={{ width:6, height:6, borderRadius:'50%', background:c }}/>{tier}</span>;
};

const AttendanceChip = ({ status }) => {
  const map = {
    Present:{fg:'var(--jp-success)', bg:'var(--jp-success-bg)', icon:'checkOnly'},
    Absent: {fg:'var(--jp-error)',   bg:'var(--jp-error-bg)',   icon:'close'},
    Late:   {fg:'var(--jp-warning)', bg:'var(--jp-warning-bg)', icon:'clock'},
    Leave:  {fg:'var(--jp-info)',    bg:'var(--jp-info-bg)',    icon:'bell'},
  }[status];
  return <span style={{
    display:'inline-flex', alignItems:'center', gap:5, padding:'4px 10px', borderRadius:999,
    background:map.bg, color:map.fg, fontSize:12, fontWeight:600,
  }}><Icon name={map.icon} size={12} color={map.fg}/> {status}</span>;
};

const PunyaBadge = ({ value, size='md' }) => {
  const big = size === 'lg';
  return <span style={{
    display:'inline-flex', alignItems:'center', gap:4,
    padding: big?'6px 12px':'3px 9px', borderRadius:999,
    background:'var(--jp-saffron-50)', color:'var(--jp-saffron)',
    fontWeight:700, fontSize: big?14:12,
  }}><Icon name="lotus" size={big?14:12} color="var(--jp-saffron)" fill="solid"/>{value}{big ? ' Punya':''}</span>;
};

const StatusBadge = ({ status }) => {
  const map = {
    Pending:    {bg:'var(--jp-warning-bg)', fg:'var(--jp-warning)'},
    Approved:   {bg:'var(--jp-success-bg)', fg:'var(--jp-success)'},
    Rejected:   {bg:'var(--jp-error-bg)',   fg:'var(--jp-error)'},
    'In review':{bg:'var(--jp-info-bg)',    fg:'var(--jp-info)'},
    Resolved:   {bg:'var(--jp-cream-dark)', fg:'var(--jp-text-sub)'},
    Active:     {bg:'var(--jp-saffron-50)', fg:'var(--jp-saffron)'},
  }[status];
  return <span style={{
    display:'inline-flex', alignItems:'center', gap:6, padding:'3px 10px', borderRadius:999,
    background:map.bg, color:map.fg, fontSize:11, fontWeight:600,
  }}><span style={{ width:5, height:5, borderRadius:'50%', background:map.fg }}/>{status}</span>;
};

/* ─────────── Section primitives ─────────── */
const SectionHeader = ({ id, eyebrow, title, sub }) => (
  <div id={id} style={{ marginBottom:24, scrollMarginTop:80 }}>
    <div style={{ fontSize:11, fontWeight:700, letterSpacing:'.18em', textTransform:'uppercase', color:'var(--jp-saffron)' }}>{eyebrow}</div>
    <h2 style={{
      fontFamily:'var(--font-display)', color:'var(--jp-maroon)',
      fontSize:36, lineHeight:1.1, margin:'6px 0 6px', fontWeight:600,
    }}>{title}</h2>
    {sub && <p style={{ color:'var(--jp-text-sub)', maxWidth:'62ch', margin:0, fontSize:15, lineHeight:'24px' }}>{sub}</p>}
  </div>
);

const Block = ({ title, sub, children, code }) => (
  <div style={{ marginBottom:28 }}>
    {title && <div style={{ marginBottom:10 }}>
      <div style={{ fontFamily:'var(--font-body)', fontWeight:600, color:'var(--jp-text-primary)', fontSize:15 }}>{title}</div>
      {sub && <div style={{ color:'var(--jp-text-sub)', fontSize:13, marginTop:2 }}>{sub}</div>}
    </div>}
    <div>{children}</div>
    {code && <CodeBlock>{code}</CodeBlock>}
  </div>
);

const CodeBlock = ({ children }) => {
  const [copied, setCopied] = useState(false);
  return (
    <div style={{
      marginTop:10, background:'var(--jp-cream-dark)', border:'1px solid var(--jp-border)',
      borderRadius:10, padding:'12px 14px', position:'relative',
      fontFamily:'var(--font-mono)', fontSize:12, lineHeight:'18px',

/* ─────────── App shell ─────────── */
function App() {
  const [theme, setTheme] = useState('light');
  const [active, setActive] = useState('foundation');
  useEffect(() => { document.documentElement.setAttribute('data-theme', theme); }, [theme]);

  // Scrollspy
  useEffect(() => {
    const onScroll = () => {
      const y = window.scrollY + 120;
      let cur = SECTIONS[0].id;
      for (const s of SECTIONS) {
        const el = document.getElementById(s.id);
        if (el && el.offsetTop <= y) cur = s.id;
      }
      setActive(cur);
    };
    window.addEventListener('scroll', onScroll, { passive:true });
    onScroll();
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  return (
    <div style={{ minHeight:'100vh', position:'relative' }}>
      {/* Hero */}
      <header style={{
        position:'relative', overflow:'hidden', borderBottom:'1px solid var(--jp-divider)',
        background:'linear-gradient(180deg, var(--jp-cream) 0%, var(--jp-surface) 100%)',
      }}>
        <div style={{ position:'absolute', right:-60, top:-60, color:'var(--jp-saffron)' }}>
          <Mandala size={420} opacity={0.07}/>
        </div>
        <div style={{ position:'absolute', left:-80, bottom:-100, color:'var(--jp-maroon)' }}>
          <Mandala size={320} opacity={0.05}/>
        </div>
        <div style={{ maxWidth:1200, margin:'0 auto', padding:'40px 28px 36px', display:'flex', alignItems:'center', gap:24, position:'relative' }}>
          <div style={{ width:88, height:88, borderRadius:18, background:'linear-gradient(135deg, var(--jp-saffron-300), var(--jp-saffron))', display:'flex', alignItems:'center', justifyContent:'center', color:'#FFFFFF', fontFamily:'var(--font-display)', fontSize:60, boxShadow:'var(--sh-3)' }}>ज</div>
          <div style={{ flex:1 }}>
            <div style={{ fontSize:11, fontWeight:700, letterSpacing:'.2em', textTransform:'uppercase', color:'var(--jp-saffron)' }}>Jain Pathshala</div>
            <h1 style={{ fontFamily:'var(--font-display)', color:'var(--jp-maroon)', fontSize:48, lineHeight:1.05, margin:'8px 0 6px', fontWeight:600 }}>The Design System</h1>
            <p style={{ color:'var(--jp-text-sub)', fontSize:16, lineHeight:'24px', maxWidth:'64ch', margin:0 }}>
              Tokens, components, and patterns for a mobile-first education-management platform serving Jain learning centres across India.
            </p>
          </div>
          <button onClick={()=>setTheme(t => t==='light' ? 'dark' : 'light')} style={{
            appearance:'none', cursor:'pointer', display:'inline-flex', alignItems:'center', gap:8,
            padding:'10px 16px', background:'var(--jp-surface)', border:'1px solid var(--jp-border)',
            borderRadius:999, color:'var(--jp-text-primary)', fontWeight:600, fontSize:13,
            boxShadow:'var(--sh-1)',
          }}>
            <Icon name={theme==='light'?'moon':'sun'} size={16}/>
            {theme==='light' ? 'Dark mode' : 'Light mode'}
          </button>
        </div>
      </header>

      {/* Body */}
      <div style={{ maxWidth:1200, margin:'0 auto', padding:'40px 28px 80px', display:'grid', gridTemplateColumns:'220px 1fr', gap:40 }}>
        {/* Rail */}
        <aside className="rail" style={{ position:'sticky', top:24, alignSelf:'start', maxHeight:'calc(100vh - 48px)', overflowY:'auto' }}>
          <div style={{ fontSize:11, fontWeight:700, letterSpacing:'.18em', textTransform:'uppercase', color:'var(--jp-text-sub)', padding:'0 12px 10px' }}>Sections</div>
          <nav style={{ display:'flex', flexDirection:'column', gap:2 }}>
            {SECTIONS.map((s,i) => (
              <a key={s.id} href={`#${s.id}`}
                style={{
                  display:'flex', alignItems:'center', gap:10, padding:'8px 12px', borderRadius:10,
                  textDecoration:'none', fontSize:13, fontWeight: active===s.id ? 600 : 500,
                  background: active===s.id ? 'var(--jp-saffron-50)' : 'transparent',
                  color: active===s.id ? 'var(--jp-saffron)' : 'var(--jp-text-primary)',
                }}>
                <span style={{ fontFamily:'var(--font-mono)', fontSize:10, color: active===s.id ? 'var(--jp-saffron)':'var(--jp-text-dim)', width:18 }}>{String(i+1).padStart(2,'0')}</span>
                <span style={{ flex:1 }}>{s.label}</span>
                {active===s.id && <Icon name="chevronR" size={12} color="var(--jp-saffron)"/>}
              </a>
            ))}
          </nav>
          <div style={{ marginTop:18, padding:'12px 14px', background:'var(--jp-cream-dark)', borderRadius:10, fontSize:11, color:'var(--jp-text-sub)', lineHeight:1.5 }}>
            Self-contained single-file build. Theme toggle persists across sections; tokens drive every component.
          </div>
        </aside>

        {/* Content */}
        <main style={{ display:'flex', flexDirection:'column', gap:64, minWidth:0 }}>
          <FoundationSection/>
          <ColorSection/>
          <TypeSection/>
          <SpacingSection/>
          <MotionSection/>
          <IconsSection/>
          <ButtonsSection/>
          <InputsSection/>
          <BadgesSection/>
          <CardsSection/>
          <MobileSection/>
          <AdminSection/>
          <IllustrationSection/>
          <IDSection/>
          <TokensSection/>
        </main>
      </div>

      <footer style={{ borderTop:'1px solid var(--jp-divider)', padding:'24px 28px', textAlign:'center', color:'var(--jp-text-sub)', fontSize:12 }}>
        Jain Pathshala Design System · single-file build · {SECTIONS.length} sections
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
