[project]
name = "jp-ai"
version = "0.1.0"
description = "Jain Pathshala — AI / ML FastAPI service (SPEC §3.5, §4.6)."
requires-python = ">=3.12"

dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "openai>=1.51,<2",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.18,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.7,<1",
  "mypy>=1.13,<2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
