kind = "mobile"
previewPath = "/mobile/"
title = "Jain Pathshala Mobile"
version = "1.0.0"
id = "apps/jain-pathshala-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 25870

[services.development]
run = "pnpm --filter @workspace/jain-pathshala-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/jain-pathshala-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/jain-pathshala-mobile", "run", "serve" ]

[services.env]
PORT = "25870"
BASE_PATH = "/mobile/"
