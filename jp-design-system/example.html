<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jain Pathshala — Quick start</title>
  <!-- 1. Pull in the token sheet. Fonts are imported inside it. -->
  <link rel="stylesheet" href="tokens.css" />
  <style>
    body { margin: 0; }
    main { max-width: 640px; margin: 0 auto; padding: var(--sp-7) var(--sp-4) var(--sp-10); }
    .stack > * + * { margin-top: var(--sp-4); }

    .jp-card {
      background: var(--jp-surface);
      border: 1px solid var(--jp-border);
      border-radius: var(--r-md);
      box-shadow: var(--sh-1);
      padding: var(--sp-5);
    }
    .jp-btn {
      display: inline-flex; align-items: center; gap: var(--sp-2);
      padding: var(--sp-3) var(--sp-5);
      background: var(--jp-saffron); color: #fff;
      border: none; border-radius: var(--r-md);
      font: var(--fw-label) var(--fs-label)/var(--lh-label) var(--font-body);
      cursor: pointer;
      transition: background var(--dur-quick) var(--ease-standard),
                  transform var(--dur-quick) var(--ease-standard);
    }
    .jp-btn:hover  { background: var(--jp-saffron-700); }
    .jp-btn:active { transform: scale(.98); }
    .jp-btn:focus-visible { outline: none; box-shadow: var(--sh-focus); }

    .jp-chip {
      display: inline-flex; align-items: center;
      padding: var(--sp-1) var(--sp-3);
      background: var(--jp-age-tarun-bg); color: var(--jp-age-tarun);
      border-radius: var(--r-pill);
      font: var(--fw-caption) var(--fs-caption)/var(--lh-caption) var(--font-body);
    }
  </style>
</head>
<body class="jp-page">
  <main class="stack">
    <p class="jp-overline">Quick start</p>
    <h1 class="jp-h1">Jain Pathshala</h1>
    <p class="jp-body-lg">
      Drop <code>tokens.css</code> into your project and use the variables
      directly, or pull in <code>tailwind.config.js</code> as a preset.
    </p>

    <div class="jp-card stack">
      <h3 class="jp-h3">Aarav has marked <span style="color:var(--jp-success)">Present</span></h3>
      <p class="jp-body">Punya +5. Streak now on day 7.</p>
      <div style="display:flex; gap: var(--sp-2); align-items:center;">
        <span class="jp-chip">Tarun</span>
        <button class="jp-btn">Open today's homework</button>
      </div>
    </div>
  </main>
</body>
</html>
