<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>

      <div style="font-family:'JetBrains Mono'; font-size:11px; color:#8B6F5E; width:120px;">12 Aug · 09:14</div>

      <div style="flex:1; font-size:13px; color:#1A0A00;">

    <div style="display:flex; padding:10px 14px; gap:14px; align-items:center;">
