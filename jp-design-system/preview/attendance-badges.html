<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center;">
    <div style="display:inline-flex; align-items:center; gap:6px; padding:6px 12px; background:#DCEEDD; color:#166534; border-radius:999px; font-size:13px; font-weight:600;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      Present
    </div>
    <div style="display:inline-flex; align-items:center; gap:6px; padding:6px 12px; background:#FBE5E5; color:#B91C1C; border-radius:999px; font-size:13px; font-weight:600;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      Absent
    </div>
    <div style="display:inline-flex; align-items:center; gap:6px; padding:6px 12px; background:#FBEED0; color:#B45309; border-radius:999px; font-size:13px; font-weight:600;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      Late
    </div>
    <div style="display:inline-flex; align-items:center; gap:6px; padding:6px 12px; background:#F5EDE0; color:#8B6F5E; border-radius:999px; font-size:13px; font-weight:600;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18"/></svg>
      Not marked
    </div>
    <div style="display:inline-flex; align-items:center; gap:6px; padding:6px 12px; background:#DDE3F4; color:#1E3A8A; border-radius:999px; font-size:13px; font-weight:600;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 4H5a2 2 0 0 0-2 2v14l4-4h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Z"/></svg>
      Leave
    </div>
  </div>
  <!-- Larger button-state versions for self-mark -->
  <div style="display:flex; gap:10px; margin-top:14px;">
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px; background:#FFFFFF; border:1.5px solid #166534; border-radius:12px;">
      <div style="width:36px;height:36px;border-radius:50%;background:#166534;color:#FFFFFF;display:flex;align-items:center;justify-content:center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <div style="font-weight:600; color:#166534; font-size:14px;">Present</div>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px; background:#FFFFFF; border:1.5px solid #E6D8C2; border-radius:12px;">
      <div style="width:36px;height:36px;border-radius:50%;background:#F5EDE0;color:#C4A882;display:flex;align-items:center;justify-content:center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </div>
      <div style="font-weight:600; color:#8B6F5E; font-size:14px;">Absent</div>
    </div>
  </div>
</div>
</body></html>
