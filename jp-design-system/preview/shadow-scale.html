<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card" style="background:#FDF8F2;">
  <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:18px;">
    <div style="text-align:center;">
      <div style="background:#FFFFFF; height:60px; border-radius:12px; box-shadow:0 1px 2px rgba(122,24,24,.06);"></div>
      <div class="mono" style="margin-top:8px;">sh-1</div>
      <div style="font-size:10px; color:#8B6F5E;">hairline rest</div>
    </div>
    <div style="text-align:center;">
      <div style="background:#FFFFFF; height:60px; border-radius:12px; box-shadow:0 2px 6px rgba(122,24,24,.08), 0 1px 2px rgba(122,24,24,.06);"></div>
      <div class="mono" style="margin-top:8px;">sh-2</div>
      <div style="font-size:10px; color:#8B6F5E;">card hover</div>
    </div>
    <div style="text-align:center;">
      <div style="background:#FFFFFF; height:60px; border-radius:16px; box-shadow:0 8px 24px rgba(122,24,24,.10), 0 2px 6px rgba(122,24,24,.06);"></div>
      <div class="mono" style="margin-top:8px;">sh-3</div>
      <div style="font-size:10px; color:#8B6F5E;">elevated</div>
    </div>
    <div style="text-align:center;">
      <div style="background:#FFFFFF; height:60px; border-radius:16px; box-shadow:0 20px 48px rgba(122,24,24,.16), 0 4px 12px rgba(122,24,24,.08);"></div>
      <div class="mono" style="margin-top:8px;">sh-4</div>
      <div style="font-size:10px; color:#8B6F5E;">modal / sheet</div>
    </div>
  </div>
  <div style="margin-top:14px; font-size:12px; color:#8B6F5E;">All shadows are tinted toward <b>maroon</b>, never gray — they sit naturally on cream.</div>
</div>
</body></html>
