<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:flex; align-items:flex-end; gap:24px;">
    <!-- xs -->
    <div style="text-align:center;">
      <div style="width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#E8A06A,#D4621A);color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;">A</div>
      <div class="mono" style="margin-top:6px;">24</div>
    </div>
    <div style="text-align:center;">
      <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#E8A06A,#D4621A);color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;">A</div>
      <div class="mono" style="margin-top:6px;">32</div>
    </div>
    <div style="text-align:center;">
      <div style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#E8A06A,#D4621A);color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;">AR</div>
      <div class="mono" style="margin-top:6px;">40</div>
    </div>
    <div style="text-align:center;">
      <div style="width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#E8A06A,#D4621A);color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;">AR</div>
      <div class="mono" style="margin-top:6px;">56 ★</div>
    </div>
    <!-- MSV badge -->
    <div style="text-align:center;">
      <div style="position:relative; width:64px;height:64px;">
        <div style="width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#E8A06A,#D4621A);color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:24px; border:3px solid #FAF1DC;">AR</div>
        <div style="position:absolute; right:-2px; bottom:-2px; background:linear-gradient(135deg,#E6C26B,#C8941F); color:#FFFFFF; font-size:8px; font-weight:800; padding:2px 5px; border-radius:6px; letter-spacing:.04em; box-shadow:0 1px 3px rgba(122,24,24,.18);">MSV</div>
      </div>
      <div class="mono" style="margin-top:6px;">MSV</div>
    </div>
    <!-- Initials only -->
    <div style="text-align:center;">
      <div style="width:56px;height:56px;border-radius:50%;background:#F5EDE0;color:#7A1818;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px; border:1px solid #E6D8C2;">DJ</div>
      <div class="mono" style="margin-top:6px;">fallback</div>
    </div>
  </div>
  <div style="margin-top:14px; font-size:12px; color:#8B6F5E;">Gradient avatars (saffron) for students. Fallback uses initials on cream-2. <b>MSV</b> gold badge denotes honors students.</div>
</div>
</body></html>
