<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card" style="background:#FDF8F2;">
  <!-- ID card design, 320 x 200 ish -->
  <div style="margin: 0 auto; width:540px; height:340px; background:#FFFFFF; border-radius:16px; box-shadow:0 8px 24px rgba(122,24,24,.10); overflow:hidden; position:relative; border:1px solid #E6D8C2;">
    <!-- Top maroon band -->
    <div style="position:relative; height:80px; background:linear-gradient(135deg,#7A1818,#5C1010); color:#FDF8F2; padding:12px 18px; display:flex; align-items:center; justify-content:space-between;">
      <div style="display:flex; align-items:center; gap:10px;">
        <div style="width:36px;height:36px;background:linear-gradient(135deg,#E8A06A,#D4621A); border-radius:8px; display:flex; align-items:center; justify-content:center; font-family:'Tiro Devanagari Sanskrit',serif; font-size:24px; color:#FFFFFF;">ज</div>
        <div>
          <div style="font-family:'Tiro Devanagari Sanskrit',serif; font-size:18px; line-height:1;">Jain Pathshala</div>
          <div style="font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:#E8A06A; margin-top:3px;">Student Identity Card · 2025–26</div>
        </div>
      </div>
      <!-- MSV badge -->
      <div style="background:linear-gradient(135deg,#E6C26B,#C8941F); color:#5C1010; padding:4px 10px; border-radius:6px; font-size:10px; font-weight:800; letter-spacing:.12em; box-shadow:0 2px 6px rgba(200,148,31,.4);">MSV</div>
    </div>
    <!-- Background motif -->
    <div style="position:absolute; right:-40px; top:60px; opacity:.05; color:#D4621A;">
      <svg width="280" height="280" viewBox="0 0 240 240" fill="none" stroke="currentColor" stroke-width="1"><circle cx="120" cy="120" r="50"/><circle cx="120" cy="120" r="80"/><circle cx="120" cy="120" r="110"/><g><path id="p" d="M120 32 C 112 64 112 96 120 120 C 128 96 128 64 120 32 Z"/><use href="#p" transform="rotate(45 120 120)"/><use href="#p" transform="rotate(90 120 120)"/><use href="#p" transform="rotate(135 120 120)"/></g></svg>
    </div>
    <!-- Body -->
    <div style="position:relative; padding:18px; display:flex; gap:18px;">
      <!-- Photo -->
      <div style="width:120px; height:144px; border-radius:8px; background:linear-gradient(135deg,#E8A06A,#D4621A); display:flex; align-items:center; justify-content:center; color:#FFFFFF; font-family:'Tiro Devanagari Sanskrit',serif; font-size:48px; flex-shrink:0; border:3px solid #FDF8F2; box-shadow:0 2px 6px rgba(122,24,24,.16);">AR</div>
      <div style="flex:1;">
        <div style="font-family:'Tiro Devanagari Sanskrit',serif; color:#7A1818; font-size:22px; line-height:1.1;">Aarav Rajesh Mehta</div>
        <div style="font-size:11px; color:#8B6F5E; margin-top:2px;">S/o Rajesh Mehta · DOB 12 Aug 2011</div>
        <div style="display:grid; grid-template-columns: auto auto; gap:6px 16px; margin-top:14px; font-size:11px;">
          <div style="color:#8B6F5E;">Student ID</div><div style="font-family:'JetBrains Mono'; font-weight:600; color:#1A0A00;">JP-PUN-0428</div>
          <div style="color:#8B6F5E;">Centre</div><div style="font-weight:600; color:#1A0A00;">Mahavir, Pune</div>
          <div style="color:#8B6F5E;">Batch</div><div style="font-weight:600; color:#1A0A00;">Tarun · Saturday 5–7 PM</div>
          <div style="color:#8B6F5E;">Tier</div><div style="display:flex; align-items:center; gap:4px;"><span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#1E3A8A;"></span><span style="font-weight:600; color:#1E3A8A; font-family:'Tiro Devanagari Sanskrit',serif;">Sadhak</span></div>
        </div>
      </div>
      <!-- QR -->
      <div style="text-align:center;">
        <div style="width:80px; height:80px; background:#FFFFFF; border:1px solid #E6D8C2; border-radius:6px; padding:4px;">
          <!-- crude QR placeholder -->
          <svg viewBox="0 0 21 21" width="72" height="72" shape-rendering="crispEdges">
            <rect width="21" height="21" fill="#FFFFFF"/>
            <g fill="#1A0A00">
              <rect x="0" y="0" width="7" height="1"/><rect x="0" y="0" width="1" height="7"/><rect x="6" y="0" width="1" height="7"/><rect x="0" y="6" width="7" height="1"/><rect x="2" y="2" width="3" height="3"/>
              <rect x="14" y="0" width="7" height="1"/><rect x="14" y="0" width="1" height="7"/><rect x="20" y="0" width="1" height="7"/><rect x="14" y="6" width="7" height="1"/><rect x="16" y="2" width="3" height="3"/>
              <rect x="0" y="14" width="7" height="1"/><rect x="0" y="14" width="1" height="7"/><rect x="6" y="14" width="1" height="7"/><rect x="0" y="20" width="7" height="1"/><rect x="2" y="16" width="3" height="3"/>
              <rect x="8" y="2" width="1" height="1"/><rect x="10" y="3" width="1" height="2"/><rect x="9" y="6" width="3" height="1"/><rect x="12" y="8" width="2" height="1"/><rect x="8" y="9" width="1" height="3"/><rect x="11" y="11" width="2" height="2"/><rect x="14" y="9" width="1" height="2"/><rect x="9" y="14" width="1" height="3"/><rect x="11" y="15" width="2" height="1"/><rect x="14" y="13" width="3" height="1"/><rect x="16" y="14" width="1" height="2"/><rect x="13" y="17" width="2" height="2"/><rect x="16" y="19" width="2" height="1"/><rect x="19" y="14" width="1" height="3"/><rect x="18" y="18" width="3" height="1"/>
            </g>
          </svg>
        </div>
        <div class="mono" style="margin-top:6px;">verify</div>
      </div>
    </div>
    <!-- Bottom strip -->
    <div style="position:absolute; left:0; right:0; bottom:0; height:24px; background:#F5EDE0; padding:0 18px; display:flex; align-items:center; justify-content:space-between; font-size:10px; color:#8B6F5E;">
      <span>Valid until 31 Mar 2026 · Property of Jain Pathshala Trust</span>
      <span style="font-family:'JetBrains Mono';">jainpathshala.app/v/JP-PUN-0428</span>
    </div>
  </div>
</div>
</body></html>
