<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center;">
    <div style="display:inline-flex; align-items:center; gap:6px; padding:6px 12px; background:#FBE5E5; color:#B91C1C; border-radius:999px; font-size:13px; font-weight:600; border:1px solid #E8B4B4;">
      <span style="width:6px;height:6px;border-radius:50%;background:#B91C1C;"></span> Bal · 6–9
    </div>
    <div style="display:inline-flex; align-items:center; gap:6px; padding:6px 12px; background:#F6ECD6; color:#854D0E; border-radius:999px; font-size:13px; font-weight:600; border:1px solid #E8D49A;">
      <span style="width:6px;height:6px;border-radius:50%;background:#854D0E;"></span> Kishor · 10–13
    </div>
    <div style="display:inline-flex; align-items:center; gap:6px; padding:6px 12px; background:#DCEEDD; color:#166534; border-radius:999px; font-size:13px; font-weight:600; border:1px solid #B7D5BA;">
      <span style="width:6px;height:6px;border-radius:50%;background:#166534;"></span> Tarun · 14–17
    </div>
    <div style="display:inline-flex; align-items:center; gap:6px; padding:6px 12px; background:#DDE3F4; color:#1E3A8A; border-radius:999px; font-size:13px; font-weight:600; border:1px solid #B4C0E0;">
      <span style="width:6px;height:6px;border-radius:50%;background:#1E3A8A;"></span> Yuva · 18+
    </div>
  </div>
  <!-- Filled / solid variants for tabs -->
  <div style="display:flex; gap:10px; margin-top:14px;">
    <div style="flex:1; padding:10px 12px; background:#B91C1C; color:#FFFFFF; border-radius:10px; font-weight:600; font-size:13px; text-align:center;">Bal</div>
    <div style="flex:1; padding:10px 12px; background:#854D0E; color:#FFFFFF; border-radius:10px; font-weight:600; font-size:13px; text-align:center;">Kishor</div>
    <div style="flex:1; padding:10px 12px; background:#166534; color:#FFFFFF; border-radius:10px; font-weight:600; font-size:13px; text-align:center;">Tarun</div>
    <div style="flex:1; padding:10px 12px; background:#1E3A8A; color:#FFFFFF; border-radius:10px; font-weight:600; font-size:13px; text-align:center;">Yuva</div>
  </div>
  <div style="margin-top:10px; font-size:12px; color:#8B6F5E;">Age colors are <b>identity</b> only — never reuse to indicate semantic state.</div>
</div>
</body></html>
