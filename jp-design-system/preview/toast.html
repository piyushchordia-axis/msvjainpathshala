<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <!-- Success toast -->
  <div style="background:#FFFFFF; border-radius:12px; padding:12px 14px; box-shadow:0 8px 24px rgba(122,24,24,.10), 0 2px 6px rgba(122,24,24,.06); display:flex; align-items:center; gap:12px; border-left:3px solid #166534;">
    <div style="width:32px;height:32px;border-radius:50%;background:#DCEEDD;color:#166534;display:flex;align-items:center;justify-content:center; flex-shrink:0;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <div style="flex:1;">
      <div style="font-weight:600; color:#1A0A00; font-size:14px;">Punya +5 credited</div>
      <div style="font-size:12px; color:#8B6F5E;">Niyam Day 7 marked complete.</div>
    </div>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C4A882" stroke-width="2.2"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </div>
  <!-- Error toast -->
  <div style="background:#FFFFFF; border-radius:12px; padding:12px 14px; box-shadow:0 8px 24px rgba(122,24,24,.10), 0 2px 6px rgba(122,24,24,.06); display:flex; align-items:center; gap:12px; border-left:3px solid #B91C1C; margin-top:10px;">
    <div style="width:32px;height:32px;border-radius:50%;background:#FBE5E5;color:#B91C1C;display:flex;align-items:center;justify-content:center; flex-shrink:0;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h0"/></svg>
    </div>
    <div style="flex:1;">
      <div style="font-weight:600; color:#1A0A00; font-size:14px;">Couldn't reach the centre</div>
      <div style="font-size:12px; color:#8B6F5E;">You're 320 m away — move closer to check in.</div>
    </div>
    <div style="font-size:13px; color:#D4621A; font-weight:600;">Retry</div>
  </div>
  <!-- In-app alert (informational) -->
  <div style="background:#DDE3F4; border-radius:12px; padding:12px 14px; display:flex; align-items:center; gap:12px; margin-top:10px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E3A8A" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h0"/></svg>
    <div style="flex:1; color:#1E3A8A; font-size:13px; font-weight:500;">Tomorrow's class is at <b>4 PM</b> instead of 5 PM.</div>
  </div>
</div>
</body></html>
