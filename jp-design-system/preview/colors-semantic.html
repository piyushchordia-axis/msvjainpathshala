<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:12px;">
    <div style="background:#DCEEDD; border-radius:12px; padding:14px; border:1px solid #B7D5BA;">
      <div style="display:flex; gap:8px; align-items:center;">
        <div style="width:10px;height:10px;border-radius:50%;background:#166534;"></div>
        <div style="font-weight:600; color:#166534; font-size:13px;">Success</div>
      </div>
      <div style="color:#166534; font-size:12px; margin-top:6px;">Punya credited</div>
      <div style="font-family:'JetBrains Mono'; font-size:10px; color:#8B6F5E; margin-top:8px;">#166534</div>
    </div>
    <div style="background:#FBEED0; border-radius:12px; padding:14px; border:1px solid #E8D49A;">
      <div style="display:flex; gap:8px; align-items:center;">
        <div style="width:10px;height:10px;border-radius:50%;background:#B45309;"></div>
        <div style="font-weight:600; color:#B45309; font-size:13px;">Warning</div>
      </div>
      <div style="color:#B45309; font-size:12px; margin-top:6px;">Late check-in</div>
      <div style="font-family:'JetBrains Mono'; font-size:10px; color:#8B6F5E; margin-top:8px;">#B45309</div>
    </div>
    <div style="background:#FBE5E5; border-radius:12px; padding:14px; border:1px solid #E8B4B4;">
      <div style="display:flex; gap:8px; align-items:center;">
        <div style="width:10px;height:10px;border-radius:50%;background:#B91C1C;"></div>
        <div style="font-weight:600; color:#B91C1C; font-size:13px;">Error</div>
      </div>
      <div style="color:#B91C1C; font-size:12px; margin-top:6px;">OTP incorrect</div>
      <div style="font-family:'JetBrains Mono'; font-size:10px; color:#8B6F5E; margin-top:8px;">#B91C1C</div>
    </div>
    <div style="background:#DDE3F4; border-radius:12px; padding:14px; border:1px solid #B4C0E0;">
      <div style="display:flex; gap:8px; align-items:center;">
        <div style="width:10px;height:10px;border-radius:50%;background:#1E3A8A;"></div>
        <div style="font-weight:600; color:#1E3A8A; font-size:13px;">Info</div>
      </div>
      <div style="color:#1E3A8A; font-size:12px; margin-top:6px;">New notice posted</div>
      <div style="font-family:'JetBrains Mono'; font-size:10px; color:#8B6F5E; margin-top:8px;">#1E3A8A</div>
    </div>
  </div>
</div>
</body></html>
