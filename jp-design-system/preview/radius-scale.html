<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:flex; align-items:center; gap:18px;">
    <div style="text-align:center;"><div style="width:64px;height:64px;background:#F5EDE0;border:1px solid #E6D8C2;border-radius:4px;"></div><div class="mono" style="margin-top:6px;">xs · 4</div></div>
    <div style="text-align:center;"><div style="width:64px;height:64px;background:#F5EDE0;border:1px solid #E6D8C2;border-radius:8px;"></div><div class="mono" style="margin-top:6px;">sm · 8</div></div>
    <div style="text-align:center;"><div style="width:64px;height:64px;background:#F5EDE0;border:1px solid #E6D8C2;border-radius:12px;"></div><div class="mono" style="margin-top:6px;">md · 12 ★</div></div>
    <div style="text-align:center;"><div style="width:64px;height:64px;background:#F5EDE0;border:1px solid #E6D8C2;border-radius:16px;"></div><div class="mono" style="margin-top:6px;">lg · 16</div></div>
    <div style="text-align:center;"><div style="width:64px;height:64px;background:#F5EDE0;border:1px solid #E6D8C2;border-radius:24px;"></div><div class="mono" style="margin-top:6px;">xl · 24</div></div>
    <div style="text-align:center;"><div style="width:64px;height:32px;background:#F5EDE0;border:1px solid #E6D8C2;border-radius:999px;"></div><div class="mono" style="margin-top:6px;">pill</div></div>
  </div>
  <div style="margin-top:14px; font-size:12px; color:#8B6F5E;">★ <b>12 px is default</b> for cards and inputs. Never mix radii within one card.</div>
</div>
</body></html>
