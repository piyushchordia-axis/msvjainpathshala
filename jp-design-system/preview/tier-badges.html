<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:grid; grid-template-columns: repeat(5, 1fr); gap:10px;">
    <!-- Jigyasu -->
    <div style="text-align:center;">
      <div style="width:64px;height:80px; margin:0 auto; background:#F5EDE0; border:2px solid #8B6F5E; border-radius:8px 8px 32px 32px; position:relative;">
        <div style="position:absolute; inset:auto 0 12px 0; font-family:'Tiro Devanagari Sanskrit',serif; color:#8B6F5E; font-size:22px;">ज</div>
      </div>
      <div style="margin-top:8px; font-family:'Tiro Devanagari Sanskrit',serif; font-size:13px; color:#8B6F5E;">Jigyasu</div>
      <div style="font-size:10px; color:#8B6F5E;">Learner</div>
    </div>
    <!-- Shravak -->
    <div style="text-align:center;">
      <div style="width:64px;height:80px; margin:0 auto; background:#DCEEDD; border:2px solid #166534; border-radius:8px 8px 32px 32px; position:relative;">
        <div style="position:absolute; inset:auto 0 12px 0; font-family:'Tiro Devanagari Sanskrit',serif; color:#166534; font-size:22px;">श्रा</div>
      </div>
      <div style="margin-top:8px; font-family:'Tiro Devanagari Sanskrit',serif; font-size:13px; color:#166534;">Shravak</div>
      <div style="font-size:10px; color:#8B6F5E;">Listener</div>
    </div>
    <!-- Sadhak -->
    <div style="text-align:center;">
      <div style="width:64px;height:80px; margin:0 auto; background:#DDE3F4; border:2px solid #1E3A8A; border-radius:8px 8px 32px 32px; position:relative;">
        <div style="position:absolute; inset:auto 0 12px 0; font-family:'Tiro Devanagari Sanskrit',serif; color:#1E3A8A; font-size:22px;">सा</div>
      </div>
      <div style="margin-top:8px; font-family:'Tiro Devanagari Sanskrit',serif; font-size:13px; color:#1E3A8A;">Sadhak</div>
      <div style="font-size:10px; color:#8B6F5E;">Seeker</div>
    </div>
    <!-- Shraman -->
    <div style="text-align:center;">
      <div style="width:64px;height:80px; margin:0 auto; background:#F4E6E6; border:2px solid #7A1818; border-radius:8px 8px 32px 32px; position:relative;">
        <div style="position:absolute; inset:auto 0 12px 0; font-family:'Tiro Devanagari Sanskrit',serif; color:#7A1818; font-size:22px;">श्र</div>
      </div>
      <div style="margin-top:8px; font-family:'Tiro Devanagari Sanskrit',serif; font-size:13px; color:#7A1818;">Shraman</div>
      <div style="font-size:10px; color:#8B6F5E;">Ascetic</div>
    </div>
    <!-- Tirthankar -->
    <div style="text-align:center;">
      <div style="width:64px;height:80px; margin:0 auto; background:linear-gradient(180deg,#FAF1DC,#E6C26B); border:2px solid #C8941F; border-radius:8px 8px 32px 32px; position:relative; box-shadow:0 4px 12px rgba(200,148,31,.35);">
        <div style="position:absolute; top:-8px; left:50%; transform:translateX(-50%); width:14px; height:14px; background:#C8941F; border-radius:50%; box-shadow:0 0 0 3px #FAF1DC;"></div>
        <div style="position:absolute; inset:auto 0 12px 0; font-family:'Tiro Devanagari Sanskrit',serif; color:#7A1818; font-size:22px; font-weight:600;">ती</div>
      </div>
      <div style="margin-top:8px; font-family:'Tiro Devanagari Sanskrit',serif; font-size:13px; color:#C8941F; font-weight:600;">Tirthankar</div>
      <div style="font-size:10px; color:#8B6F5E;">Enlightened</div>
    </div>
  </div>
</div>
</body></html>
