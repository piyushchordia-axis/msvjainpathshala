<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="background:#FFFFFF; border-radius:16px; padding:16px; box-shadow:0 8px 24px rgba(122,24,24,.10), 0 2px 6px rgba(122,24,24,.06); border-left:4px solid #166534;">
    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
      <div>
        <div style="display:inline-flex; align-items:center; gap:6px; padding:3px 10px; background:#DCEEDD; color:#166534; border-radius:999px; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;">
          <span style="width:6px;height:6px;border-radius:50%;background:#166534;display:inline-block; animation:pulse 1.4s infinite;"></span>
          Session active
        </div>
        <div style="font-family:'Tiro Devanagari Sanskrit',serif; color:#7A1818; font-size:22px; margin-top:8px;">Mahavir Centre</div>
        <div style="font-size:13px; color:#8B6F5E; margin-top:2px;">Checked in 9:02 AM · within 80 m of centre</div>
      </div>
      <div style="text-align:right;">
        <div style="font-family:'JetBrains Mono'; font-size:32px; font-weight:600; color:#1A0A00; line-height:1;">01:48:22</div>
        <div style="font-size:11px; color:#8B6F5E; margin-top:4px;">Live timer</div>
      </div>
    </div>
    <div style="display:flex; gap:10px; margin-top:14px;">
      <div style="flex:1; background:#D4621A; color:#FFFFFF; border-radius:12px; padding:12px; text-align:center; font-weight:600; font-size:15px; box-shadow:0 2px 6px rgba(122,24,24,.08);">Check Out</div>
      <div style="display:flex; align-items:center; justify-content:center; width:48px; background:#FFFFFF; border:1.5px solid #E6D8C2; border-radius:12px; color:#7A1818;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="10" r="3"/><path d="M12 2a8 8 0 0 0-8 8c0 7 8 12 8 12s8-5 8-12a8 8 0 0 0-8-8Z"/></svg>
      </div>
    </div>
  </div>
</div>
<style>@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}</style>
</body></html>
