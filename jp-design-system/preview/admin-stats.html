<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:12px;">
    <div style="background:#FFFFFF; border:1px solid #E6D8C2; border-radius:12px; padding:16px; box-shadow:0 1px 2px rgba(122,24,24,.06);">
      <div style="font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:#8B6F5E;">Active students</div>
      <div style="font-family:'Tiro Devanagari Sanskrit',serif; font-size:36px; line-height:42px; color:#1A0A00; margin-top:4px;">1,248</div>
      <div style="display:inline-flex; align-items:center; gap:4px; padding:2px 8px; background:#DCEEDD; color:#166534; border-radius:999px; font-size:11px; font-weight:600; margin-top:6px;">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="m7 17 5-5 5 5h-3v4h-4v-4H7Z"/></svg> +8.2%
      </div>
    </div>
    <div style="background:#FFFFFF; border:1px solid #E6D8C2; border-radius:12px; padding:16px; box-shadow:0 1px 2px rgba(122,24,24,.06);">
      <div style="font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:#8B6F5E;">Today's attendance</div>
      <div style="font-family:'Tiro Devanagari Sanskrit',serif; font-size:36px; line-height:42px; color:#1A0A00; margin-top:4px;">89<span style="font-size:20px; color:#8B6F5E;">%</span></div>
      <div style="display:inline-flex; align-items:center; gap:4px; padding:2px 8px; background:#FBEED0; color:#B45309; border-radius:999px; font-size:11px; font-weight:600; margin-top:6px;">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="m17 7-5 5-5-5h3V3h4v4Z"/></svg> −2.1%
      </div>
    </div>
    <div style="background:#FFFFFF; border:1px solid #E6D8C2; border-radius:12px; padding:16px; box-shadow:0 1px 2px rgba(122,24,24,.06);">
      <div style="font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:#8B6F5E;">Punya awarded</div>
      <div style="font-family:'Tiro Devanagari Sanskrit',serif; font-size:36px; line-height:42px; color:#D4621A; margin-top:4px;">14,820</div>
      <div style="display:inline-flex; align-items:center; gap:4px; padding:2px 8px; background:#FCEFE3; color:#B5521A; border-radius:999px; font-size:11px; font-weight:600; margin-top:6px;">this week</div>
    </div>
  </div>
</div>
</body></html>
