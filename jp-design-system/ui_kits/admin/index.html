<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jain Pathshala — Admin UI Kit</title>
<link rel="stylesheet" href="../../tokens.css">
<style>
  html, body { margin:0; padding:0; background:#F5EDE0; min-height:100vh; font-family: var(--font-body); -webkit-font-smoothing:antialiased; }
  .stage { min-height:100vh; padding:24px; display:flex; flex-direction:column; align-items:center; gap:20px;
    background:
      radial-gradient(circle at 20% 0%, #FDF8F2 0%, transparent 35%),
      radial-gradient(circle at 100% 100%, #FCEFE3 0%, transparent 40%),
      #F5EDE0;
  }
  .kit-header { width: 100%; max-width: 1280px; }
  .kit-header h1 { font-family: var(--font-display); color: var(--jp-maroon); font-size:32px; line-height:1.1; margin:0; }
  .kit-header p { color: var(--jp-text-sub); margin:6px 0 0; font-size:14px; max-width:64ch; }
</style>
</head>
<body>
<div class="stage">
  <div class="kit-header">
    <h1>Admin UI Kit</h1>
    <p>Next.js admin panel — sidebar, topbar, stats, table, composer, and audit log. Use the role switcher (City / Sanchalak / Super) in the top-right to see how navigation reshapes per-role.</p>
  </div>
  <div id="root"></div>
</div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tokens.jsx"></script>
<script type="text/babel" src="browser-window.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
