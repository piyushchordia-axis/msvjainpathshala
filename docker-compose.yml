# Jain Pathshala API — connects to the HOST's existing Postgres + Redis.
#
# Uses host networking so the container reaches Postgres/Redis on 127.0.0.1
# (no need to expose them to Docker), and the host's nginx reverse-proxies to
# 127.0.0.1:8080. The app binds 127.0.0.1 (HOST below), so :8080 is NOT exposed
# publicly — nginx terminates TLS and forwards in.
#
# Usage:
#   cp apps/api-server/.env.example apps/api-server/.env   # then fill it in
#   docker compose up -d --build
#   docker compose logs -f

services:
  api:
    build:
      context: .
      dockerfile: apps/api-server/Dockerfile
    image: jain-pathshala-api:latest
    container_name: jain-pathshala-api
    restart: unless-stopped
    # Linux: shares the host net namespace -> Postgres/Redis on localhost work
    # as-is, and nginx hits 127.0.0.1:8080. (On macOS/Windows Docker Desktop this
    # maps to the VM, not the real host — fine, the target is a Linux server.)
    network_mode: host
    env_file:
      - apps/api-server/.env
    environment:
      # Defaults to production; set NODE_ENV=development in a root .env on a
      # test/QA host to enable the dev fixed-OTP path (settings.default_otp_code).
      NODE_ENV: "${NODE_ENV:-production}"
      HOST: 127.0.0.1
      # API_PORT lets you avoid a clash with another service on the host
      # (e.g. set API_PORT=8090 in a root .env). nginx must proxy to the same port.
      PORT: "${API_PORT:-8080}"
      PROCESS_ROLE: api
      UPLOADS_DIR: /data/uploads
    volumes:
      - jp_uploads:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT}/api/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # PERF #15 — BullMQ consumers + frozen cron table. Same image as api; no HTTP.
  worker:
    image: jain-pathshala-api:latest
    container_name: jain-pathshala-worker
    restart: unless-stopped
    network_mode: host
    depends_on:
      api:
        condition: service_started
    env_file:
      - apps/api-server/.env
    environment:
      NODE_ENV: "${NODE_ENV:-production}"
      PROCESS_ROLE: worker
      UPLOADS_DIR: /data/uploads
      UV_THREADPOOL_SIZE: "8"
      # Smaller pool than the API; long jobs use workerPool (statement_timeout off).
      PG_POOL_MAX: "${PG_WORKER_HTTP_POOL_MAX:-5}"
      PG_WORKER_POOL_MAX: "${PG_WORKER_POOL_MAX:-5}"
    volumes:
      - jp_uploads:/data/uploads
    command: ["node", "--enable-source-maps", "dist/worker.mjs"]

volumes:
  jp_uploads:
