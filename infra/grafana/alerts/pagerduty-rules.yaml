# PagerDuty alert rules — provisioned for Grafana Unified Alerting.
#
# Each rule:
#   - emits to the `pagerduty` contact point (terraform-managed key).
#   - includes a runbook URL pointing into docs/runbooks/ so the responder
#     lands on the mitigation steps immediately.
#
# Severities map to PagerDuty incident severity:
#   sev1 → critical
#   sev2 → error
#   sev3 → warning

apiVersion: 1

groups:
  - name: platform-health
    folder: Jain Pathshala
    interval: 1m
    rules:
      - uid: api_p95_high
        title: 'API p95 latency > 2s'
        condition: B
        for: 5m
        annotations:
          severity: sev1
          summary: 'API p95 latency > 2s for 5 min'
          runbook_url: 'https://github.com/enaa/jain-pathshala/blob/main/docs/runbooks/runaway-bullmq-queue.md'
        labels: { service: api, severity: sev1 }
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: 'histogram_quantile(0.95, sum(rate(http_request_duration_ms_bucket{service="api"}[5m])) by (le))'
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions: [{ evaluator: { params: [2000], type: gt } }]

      - uid: error_rate_high
        title: 'API 5xx > 1% for 3 min'
        condition: B
        for: 3m
        annotations:
          severity: sev1
          summary: '5xx error rate exceeds 1%'
          runbook_url: 'https://github.com/enaa/jain-pathshala/blob/main/docs/runbooks/database-failover.md'
        labels: { service: api, severity: sev1 }
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: 'sum(rate(http_requests_total{service="api",status=~"5.."}[5m])) / sum(rate(http_requests_total{service="api"}[5m]))'
          - refId: B
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions: [{ evaluator: { params: [0.01], type: gt } }]

      - uid: db_pool_exhausted
        title: 'DB pool > 95% for 5 min'
        condition: B
        for: 5m
        annotations:
          severity: sev1
          summary: 'Postgres connection pool nearly exhausted'
          runbook_url: 'https://github.com/enaa/jain-pathshala/blob/main/docs/runbooks/database-failover.md'
        labels: { service: api, severity: sev1 }
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: 'pg_pool_in_use{service="api"} / pg_pool_max{service="api"}'
          - refId: B
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions: [{ evaluator: { params: [0.95], type: gt } }]

  - name: queues
    folder: Jain Pathshala
    interval: 1m
    rules:
      - uid: queue_backlog
        title: 'Queue waiting > 10k for 5 min'
        condition: B
        for: 5m
        annotations:
          severity: sev2
          summary: 'BullMQ queue waiting > 10000'
          runbook_url: 'https://github.com/enaa/jain-pathshala/blob/main/docs/runbooks/runaway-bullmq-queue.md'
        labels: { service: worker, severity: sev2 }
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: 'max(bullmq_waiting_count) by (queue)'
          - refId: B
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions: [{ evaluator: { params: [10000], type: gt } }]

      - uid: dlq_growth
        title: 'DLQ > 100 for any queue'
        condition: B
        for: 5m
        annotations:
          severity: sev2
          summary: 'Dead-letter queue is growing'
          runbook_url: 'https://github.com/enaa/jain-pathshala/blob/main/docs/runbooks/dlq-replay.md'
        labels: { service: worker, severity: sev2 }
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: 'max(bullmq_dlq_count) by (queue)'
          - refId: B
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions: [{ evaluator: { params: [100], type: gt } }]

  - name: business-correctness
    folder: Jain Pathshala
    interval: 5m
    rules:
      - uid: punya_drift
        title: 'Punya reconcile flagged > 10 students'
        condition: B
        annotations:
          severity: sev2
          summary: 'Punya balances drift detected'
          runbook_url: 'https://github.com/enaa/jain-pathshala/blob/main/docs/runbooks/leaderboard-drift.md'
        labels: { service: punya, severity: sev2 }
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: 'max(punya_reconcile_drift_count)'
          - refId: B
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions: [{ evaluator: { params: [10], type: gt } }]

  - name: infra
    folder: Jain Pathshala
    interval: 5m
    rules:
      - uid: disk_low
        title: 'RDS free storage < 20%'
        condition: B
        annotations:
          severity: sev3
          summary: 'RDS free storage low'
          runbook_url: 'https://github.com/enaa/jain-pathshala/blob/main/docs/runbooks/database-failover.md'
        labels: { service: rds, severity: sev3 }
        data:
          - refId: A
            datasourceUid: cloudwatch
            model:
              metricName: FreeStorageSpacePercent
              namespace: AWS/RDS
          - refId: B
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions: [{ evaluator: { params: [20], type: lt } }]

      - uid: cert_expiry
        title: 'ACM cert expires < 30 days'
        condition: B
        annotations:
          severity: sev3
          summary: 'TLS cert renewal due'
        labels: { service: acm, severity: sev3 }
        data:
          - refId: A
            datasourceUid: cloudwatch
            model:
              metricName: DaysToExpiry
              namespace: AWS/CertificateManager
          - refId: B
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions: [{ evaluator: { params: [30], type: lt } }]
