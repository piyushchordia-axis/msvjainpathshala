# Jain Pathshala — local development infrastructure.
#
# Per SPEC.md §18.2, the full local stack also includes api / worker / web / ai
# services built from per-app Dockerfiles. Those are added in their respective
# build steps (Step 3 for api+worker, later for web and ai); Step 1 brings up
# only the underlying infrastructure that everything else depends on.
#
# Bring up:   docker compose -f infra/docker/docker-compose.yml up -d
# Tear down:  docker compose -f infra/docker/docker-compose.yml down
# Status:     docker compose -f infra/docker/docker-compose.yml ps

services:
  postgres:
    image: postgres:16-alpine
    container_name: jp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jp
      POSTGRES_PASSWORD: jp_dev_pwd
      POSTGRES_DB: jainpathshala
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jp -d jainpathshala']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: jp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio:latest
    container_name: jp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot init container — creates the four Step 11 buckets and applies the
  # public-download policy to jp-dev-media-public. Idempotent; the script
  # only creates buckets that don't already exist.
  minio-bootstrap:
    image: minio/mc:latest
    container_name: jp-minio-bootstrap
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_HOST: http://minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      S3_BUCKET_PRIVATE: jp-dev-media-private
      S3_BUCKET_PUBLIC: jp-dev-media-public
      S3_BUCKET_EXPORTS: jp-dev-exports
      S3_BUCKET_RECEIPTS: jp-dev-receipts
    volumes:
      - ./minio-bootstrap.sh:/usr/local/bin/minio-bootstrap.sh:ro
    entrypoint: ['/bin/sh', '/usr/local/bin/minio-bootstrap.sh']
    restart: 'no'

  mailhog:
    image: mailhog/mailhog:latest
    container_name: jp-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI
    # No healthcheck: the MailHog image is too minimal (no curl / wget / nc /
    # bash). The container being "Up" is the readiness signal; SMTP+UI become
    # reachable as soon as the process binds.

volumes:
  pgdata:
  redisdata:
  miniodata:
