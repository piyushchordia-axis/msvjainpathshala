name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Typecheck
        run: pnpm run typecheck

  test:
    name: API tests
    runs-on: ubuntu-latest

    # The api-server `test` script hard-codes its connection string
    # (DATABASE_URL=postgres://sumit@localhost:5432/jainpathshala vitest run),
    # so the Postgres service, the schema push, and the seed must all target
    # that same role/database for the suite to find its data.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sumit
          POSTGRES_DB: jainpathshala
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sumit -d jainpathshala"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://sumit@localhost:5432/jainpathshala
      JP_AUTH_SECRET: jp-ci-test-secret-not-for-production
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Push database schema
        run: pnpm --filter @workspace/db run push-force

      - name: Seed database
        run: pnpm --filter @workspace/db run seed

      - name: Run API tests
        working-directory: artifacts/api-server
        run: pnpm run test
