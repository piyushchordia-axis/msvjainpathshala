name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      # PERF #2: leftover agent-debug fetch() to 127.0.0.1:7744 previously sat
      # in the offline sync transport. Fail the build if it (or the marker
      # region) reappears under apps/.
      - name: Ban leftover debug telemetry
        run: |
          set -euo pipefail
          if rg -n --glob '!**/node_modules/**' --glob '!**/dist/**' \
              -e '#region agent log' -e '127\.0\.0\.1:7744' apps/; then
            echo "::error::Forbidden debug telemetry found under apps/ (see PERF #2)"
            exit 1
          fi
          echo "OK: no agent-log / 7744 telemetry under apps/"

      - name: Typecheck
        run: pnpm run typecheck

  build:
    name: Build production API bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      # Build the production API artifact (esbuild bundle -> dist/index.mjs), the
      # same build the Docker/deploy path runs. Catches a broken prod build that
      # typecheck and the test suite would otherwise let through green.
      - name: Build API bundle
        run: pnpm --filter @workspace/api-server run build

      # PERF #1: every package the bundle imports that is listed in build.mjs
      # `external` must resolve in the runtime image. smoke-externals.mjs derives
      # the import checklist from that array + dist — a hand-written list of
      # three would drift the next time someone externalizes a new dep. Package
      # versions are read from the Dockerfile install line so CI and the image
      # cannot diverge.
      - name: Smoke externalized runtime deps
        run: |
          set -euo pipefail
          pkgs=$(grep -oE '@?[A-Za-z0-9/_.-]+@[0-9]+\.[0-9]+\.[0-9]+' apps/api-server/Dockerfile | tr '\n' ' ')
          echo "Installing runtime externals from Dockerfile: $pkgs"
          docker run --rm \
            -v "$PWD/apps/api-server/build.mjs:/smoke/build.mjs:ro" \
            -v "$PWD/apps/api-server/dist/index.mjs:/smoke/dist/index.mjs:ro" \
            -v "$PWD/apps/api-server/scripts/smoke-externals.mjs:/tmp/smoke-externals.mjs:ro" \
            -e SMOKE_BUILD_MJS=/smoke/build.mjs \
            -e SMOKE_DIST_MJS=/smoke/dist/index.mjs \
            -w /tmp \
            node:22-alpine \
            sh -c "npm init -y >/dev/null 2>&1 && npm install --omit=dev --no-audit --no-fund $pkgs && node /tmp/smoke-externals.mjs"

  test:
    name: API tests
    runs-on: ubuntu-latest

    # Same jp credentials as local Docker. CI maps the service to host :5432;
    # local docker-compose maps jp-postgres to :5434. setup.ts falls back to
    # :5434 only when DATABASE_URL is unset, so this env wins in CI.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jp
          POSTGRES_PASSWORD: jp_dev_pwd
          POSTGRES_DB: jainpathshala
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jp -d jainpathshala"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://jp:jp_dev_pwd@localhost:5432/jainpathshala
      JP_AUTH_SECRET: jp-ci-test-secret-not-for-production
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Push database schema
        run: pnpm --filter @workspace/db run push-force

      - name: Seed database
        # ALLOW_SEED opt-in: seed.ts refuses to run without it (destructive
        # TRUNCATE guard). NODE_ENV=test here also keeps the prod guard happy.
        run: ALLOW_SEED=1 pnpm --filter @workspace/db run seed

      - name: Run API tests
        working-directory: apps/api-server
        run: pnpm run test
